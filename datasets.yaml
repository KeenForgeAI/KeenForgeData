    emoji: "☀️"
    domain_en: "Energy — photovoltaic inspection"
    domain_zh: "能源 — 光伏组件巡检"
    domain_short: "Energy (PV)"
    images: 1044
    boxes: 3403
    classes: 5
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/PV_Multi_Defect-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/PV_Multi_Defect-corrected
    doi: 10.57967/hf/10882
    description_en: "Photovoltaic (PV) panel multi-defect detection, 5 classes (VOC + YOLO) — cleaned, de-duplicated and split version of the PV-Multi-Defect dataset"
    description_zh: "光伏组件多缺陷检测，5 类（VOC + YOLO）—— PV-Multi-Defect 数据集的清理、去重与划分版"
    blurb_en: "Photovoltaic panel multi-defect detection (hot spot / scratch / border / non-electricity / broken), 5 classes, Pascal VOC + YOLO annotations, with a near-duplicate-aware split."
    blurb_zh: "光伏组件多缺陷检测（亮斑 / 划痕 / 边框 / 无电 / 破损），5 类，Pascal VOC + YOLO 格式，近重复感知划分。"
    summary_en: "Cleaned, split and standardized version of the **PV-Multi-Defect** photovoltaic panel defect dataset (Li, Wang & Zhang, *Electronics* 2023, DOI 10.3390/electronics12030561; upstream [houhou34/PV-Multi-Defect](https://github.com/houhou34/PV-Multi-Defect); upstream licence unstated): **61 byte-identical duplicate images** (61 pairs) were removed; **2 unannotated images** (`img3059`, `img9513`) and **1 empty annotation** (`img7863`) were dropped; the single near-duplicate cluster (12 perceptually identical images) was grouped so it stays on one side of a seeded, class-stratified **70/15/15** split (upstream had none); the VOC metadata was cleaned (a bogus `<folder>` value `new`/`result2` and a hard-coded personal Windows `<path>` such as `C:\\Users\\86151\\Desktop\\\\...`); and YOLO TXT annotations, `classes.txt`, `data.yaml` and CSVs were generated. **All 3,403 bounding boxes are carried over unchanged** — no coordinate was scaled, shifted or re-guessed. 5 classes: `hot_spot` (1,553), `scratch` (1,349), `black_border` (251), `no_electricity` (158), `broken` (92)."
    summary_zh: "**PV-Multi-Defect** 光伏组件缺陷数据集的清理、划分与标准化版（Li、Wang 与 Zhang，*Electronics* 2023，DOI 10.3390/electronics12030561；上游 [houhou34/PV-Multi-Defect](https://github.com/houhou34/PV-Multi-Defect)；上游未声明许可证）：删除 **61 张逐字节完全重复图**（61 对）；剔除 **2 张无标注图**（`img3059`、`img9513`）与 **1 个空标注**（`img7863`）；把唯一的近重复簇（12 张感知近似图）归组并固定到同一划分，配合固定种子、按类别分层的 **70/15/15** 划分（上游完全没有划分）；清理 VOC 元数据（错误的 `<folder>` 值 `new`/`result2`，以及泄露个人 Windows 路径的硬编码 `<path>`，如 `C:\\Users\\86151\\Desktop\\\\...`）；并生成 YOLO TXT 标注、`classes.txt`、`data.yaml` 与 CSV。**3,403 个标注框全部原样迁移**，未做任何缩放、平移或重推。5 类：`hot_spot`（1,553）、`scratch`（1,349）、`black_border`（251）、`no_electricity`（158）、`broken`（92）。"

  - id: DBA_Fire_Smoke-corrected
    emoji: "🔥"
    domain_en: "Safety — fire & smoke detection"
    domain_zh: "安防 — 火焰与烟雾检测"
    domain_short: "Safety (fire/smoke)"
    images: 3846
    boxes: 7988
    classes: 2
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/DBA_Fire_Smoke-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/DBA_Fire_Smoke-corrected
    doi: 10.57967/hf/10880
    description_en: "Fire and smoke detection, 2 classes (VOC + YOLO) — de-duplicated and split version of the DBA-Fire dataset"
    description_zh: "火焰与烟雾检测，2 类（VOC + YOLO）—— DBA-Fire 数据集的去重与划分版"
    blurb_en: "Fire and smoke detection (flame / smoke), 2 classes, Pascal VOC + YOLO annotations, with a near-duplicate-aware split."
    blurb_zh: "火焰与烟雾检测（火焰 / 烟雾），2 类，Pascal VOC + YOLO 格式，近重复感知划分。"
    summary_en: "Cleaned, de-duplicated, split and standardized version of the **DBA-Fire** fire and smoke detection dataset (reference paper: *DBA-YOLO: A Lightweight Fire Detection Algorithm with Structural Reparameterized Multiple Attention Mechanisms*; upstream licence unstated): **59 byte-identical duplicate images** (57 groups) were removed; because many images are perceptually near-identical (consecutive video frames plus re-encoded copies), each of the **3,014 near-duplicate clusters** (largest 87 images; 1,028 images live in multi-image clusters) was assigned **entirely to one split** so near-identical content never straddles train/val/test; **521 filenames** containing spaces/parentheses were normalised to `[A-Za-z0-9._-]`; a seeded, class-stratified **70/15/15** split was added (upstream had none); and Pascal VOC XML + YOLO TXT annotations, `classes.txt`, `data.yaml` and CSVs were generated. **All 7,988 bounding boxes are carried over unchanged** — no coordinate was scaled, shifted or re-guessed."
    summary_zh: "**DBA-Fire** 火焰与烟雾检测数据集的清理、去重、划分与标准化版（参考论文《DBA-YOLO: A Lightweight Fire Detection Algorithm with Structural Reparameterized Multiple Attention Mechanisms》；上游未声明许可证）：删除 **59 张逐字节完全重复图**（57 组）；由于大量图片在感知上几乎相同（连续视频帧 + 重编码副本），把 **3,014 个近重复分组**（最大一组 87 张；共 1,028 张位于多图分组）**整组分配到同一划分**，确保近似内容绝不跨越 train/val/test；把 **521 个含空格/括号的文件名**规整为 `[A-Za-z0-9._-]`；新增固定种子、按类别分层的 **70/15/15** 划分（上游完全没有划分）；并生成 Pascal VOC XML + YOLO TXT 标注、`classes.txt`、`data.yaml` 与 CSV。**7,988 个标注框全部原样迁移**，未做任何缩放、平移或重推。"

  - id: CPLID_Insulators-corrected
    emoji: "⚡"
    domain_en: "Energy — power-line inspection"
    domain_zh: "能源 — 电力巡线"
    domain_short: "Energy (power-line)"
    images: 845
    boxes: 1566
    classes: 2
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/CPLID_Insulators-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/CPLID_Insulators-corrected
    doi: 10.57967/hf/10878
    description_en: "Power-line insulator defect detection, 2 classes (VOC + YOLO) — cleaned and split version of the Chinese Power Line Insulator Dataset (CPLID)"
    description_zh: "电力巡线绝缘子缺陷检测，2 类（VOC + YOLO）—— 中国电力线绝缘子数据集（CPLID）的清理与划分版"
    blurb_en: "Power-line insulator defect detection (insulator / defect), 2 classes, Pascal VOC + YOLO annotations, with a burst-frame-aware split."
    blurb_zh: "电力巡线绝缘子缺陷检测（绝缘子 / 缺陷），2 类，Pascal VOC + YOLO 格式，连拍帧感知划分。"
    summary_en: "Cleaned, split and standardized version of the **Chinese Power Line Insulator Dataset (CPLID)** (Tao et al., *IEEE TSMC: Systems* 2018; images provided by the State Grid Corporation of China, assembled by WANG Zi-Hao; upstream [InsulatorData/InsulatorDataSet](https://github.com/InsulatorData/InsulatorDataSet)): **3 pixel-identical duplicate images** in `Normal_Insulators` were removed (`0150`=`2984`, `0852`=`1876`, `1608`=`1938`); because the 600 normal images are **UAV video frames**, consecutive captures were grouped into **486 frame chains** and each chain assigned entirely to one split so no near-identical burst straddles train/val/test; the two parallel defective-insulator label folders (`labels/defect/` + `labels/insulator/`) were **merged into one annotation per image** (insulator box + defect box); a seeded, class-stratified **70/15/15** split was added (upstream had none); the VOC metadata was cleaned (bogus `<folder>` values `images`/`long`/empty, and a hard-coded local `<path>` leaking personal absolute paths with Chinese characters); a stray 48-byte non-image file (`OriginalImageOnWebDriver`) was removed; and Pascal VOC + YOLO annotations, `classes.txt`, `data.yaml` and CSVs were added. **All 1,566 bounding boxes are carried over unchanged** — no coordinate was scaled, shifted or re-guessed. Note: the **defective** images are **synthetic** (TVSeg + U-Net pipeline, as described upstream). Upstream licence unstated."
    summary_zh: "**中国电力线绝缘子数据集（CPLID）** 的清理、划分与标准化版（Tao 等，*IEEE TSMC: Systems* 2018；图像由国家电网公司提供，王自浩整理；上游 [InsulatorData/InsulatorDataSet](https://github.com/InsulatorData/InsulatorDataSet)）：删除 `Normal_Insulators` 中的 **3 张像素级完全重复图**（`0150`=`2984`、`0852`=`1876`、`1608`=`1938`）；由于 600 张正常图均为**无人机视频帧**，将连续帧归并为 **486 个连拍链**，整链分配到同一划分，确保近似重复帧不会跨越 train/val/test；把两个平行的缺陷绝缘子标签目录（`labels/defect/` + `labels/insulator/`）**合并为每图一份标注**（绝缘子框 + 缺陷框）；新增固定种子、按类别分层的 **70/15/15** 划分（上游完全没有划分）；清理 VOC 元数据（错误的 `<folder>` 值 `images`/`long`/空，以及泄露含中文个人绝对路径的硬编码 `<path>`）；删除一个 48 字节的垃圾非图片文件（`OriginalImageOnWebDriver`）；并补充 Pascal VOC + YOLO 标注、`classes.txt`、`data.yaml` 与 CSV。**1,566 个标注框全部原样迁移**，未做任何缩放、平移或重推。注意：**缺陷图是合成的**（上游所述 TVSeg + U-Net 流程）。上游未声明许可证。"

  - id: PlantDoc-corrected
    emoji: "🌱"
    domain_en: "Agriculture — plant disease"
    domain_zh: "农业 — 植物病害"
    domain_short: "Agriculture (plant disease)"
    images: 2565
    boxes: 8887
    classes: 29
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/PlantDoc-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/PlantDoc-corrected
    doi: 10.57967/hf/10678
    description_en: "Plant leaf disease detection, 29 classes (VOC + YOLO) — cleaned version of PlantDoc with train/test leakage removed and a reproducible split added"
    description_zh: "植物叶片病害检测，29 类（VOC + YOLO）—— PlantDoc 数据集的清理修正版，已剔除训练/测试泄漏并补上可复现划分"
    blurb_en: "Plant leaf disease detection across 13 crops, 29 classes, Pascal VOC + YOLO annotations, with train/test leakage removed."
    blurb_zh: "覆盖 13 种作物的植物叶片病害检测，29 类，Pascal VOC + YOLO 格式，已剔除训练/测试泄漏。"
    summary_en: "Cleaned version of the **PlantDoc** object-detection dataset (Singh et al., CoDS-COMAD 2020, [doi:10.1145/3371158.3371196](https://doi.org/10.1145/3371158.3371196), CC BY 4.0): **12 images were byte-identical between `TRAIN/` and `TEST/`** — a hard train/test leak — and were removed; 11 images shipped with an **empty XML** (no `<object>`) and 11 more with **no XML at all** were dropped; 4 images downloaded only as low-resolution thumbnails while annotated at original resolution (so their boxes lie outside the frame) were dropped, as was 1 orphan XML; **35 images carried an EXIF orientation tag** while their boxes had been authored against the stored pixel orientation — 30 received a byte-level tag strip (pixels untouched) and 5 had the EXIF rotation baked into the pixels, so the annotation canvas now matches the stored pixels under every loader (PIL, OpenCV, Ultralytics); 4 VOC files declaring `<width>0</width><height>0</height>` were repaired; **all 234 URL-tainted filenames** (`%20`, `+`, `?itok=`, `%253E`, 25 extension-less files and 12 with script extensions such as `.ashx`) were sanitised, and scraped SEO names running up to 215 characters were truncated to ≤80 characters plus an 8-hex-digit hash of the upstream name; all **29 class names** were normalised to Title Case (fixing the `Soyabean` typo); and a reproducible split was added — the official `TEST/` (236) is kept as **test** for paper comparability while a stratified 10 % **val** (233) is carved out of `TRAIN/` (seed 42). **All 8,887 bounding boxes are carried over unchanged** — no coordinate was scaled, shifted or re-guessed."
    summary_zh: "**PlantDoc** 目标检测数据集的清理修正版（Singh 等，CoDS-COMAD 2020，[doi:10.1145/3371158.3371196](https://doi.org/10.1145/3371158.3371196)，CC BY 4.0）：**12 张图像在 `TRAIN/` 与 `TEST/` 中逐字节相同** —— 属于硬性训练/测试泄漏，已删除；11 张图像携带**空 XML**（无 `<object>`）、另有 11 张**完全没有 XML**，均已剔除；4 张图像只下载到低分辨率缩略图却按原图分辨率标注（标注框落在画布之外）被剔除，另剔除 1 个孤立 XML；**35 张图像带有 EXIF 方向标签**，而其标注框是按**存储像素方向**绘制的 —— 其中 30 张采用字节级剥离方向标签（像素不变），5 张把 EXIF 旋转**烘焙进像素**，从而使无论在哪个框架下读取（PIL、OpenCV、Ultralytics），标注画布都与存储像素方向一致；4 个声明 `<width>0</width><height>0</height>` 的 VOC 文件已修复；**全部 234 个含 URL 污染的文件名**（`%20`、`+`、`?itok=`、`%253E`，其中 25 个无扩展名、12 个带 `.ashx` 等网页脚本扩展名）已净化，上游抓取网页留下的最长 215 字符的 SEO 长文件名统一截断至 ≤80 字符并追加原文件名的 8 位十六进制哈希；**29 个类别名**全部统一为 Title Case（并修正 `Soyabean` 拼写错误）；同时补上可复现划分 —— 官方 `TEST/`（236 张）保留为 **test** 以便与论文对比，并从 `TRAIN/` 中分层切出 10% 作为 **val**（233 张，随机种子 42）。**8,887 个标注框全部原样迁移**，未做任何缩放、平移或重推。"

  - id: PCB_AoI_KubeEdge-corrected
    emoji: "🖥️"
    domain_en: "Industrial — PCB"
    domain_zh: "工业 — PCB"
    domain_short: "Industrial (PCB)"
    images: 233
    boxes: 1011
    classes: 2
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/PCB_AoI_KubeEdge-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/PCB_AoI_KubeEdge-corrected
    doi: 10.57967/hf/10677
    description_en: "PCB AOI defect detection, 2 classes (VOC + YOLO) — cleaned version of the KubeEdge-Ianvs PCB-AoI dataset, with a training-only augmentation set"
    description_zh: "PCB AOI 缺陷检测，2 类（VOC + YOLO）—— KubeEdge-Ianvs PCB-AoI 数据集的清理修正版，含仅训练用增强集"
    blurb_en: "PCB AOI defect detection, 2 classes, Pascal VOC + YOLO annotations, with a de-duplicated training-only augmentation set."
    blurb_zh: "PCB AOI 缺陷检测，2 类，Pascal VOC + YOLO 格式，含去重后的仅训练用增强集。"
    summary_en: "Cleaned version of the **PCB-AoI Public Dataset** (KubeEdge-Ianvs, by KubeEdge SIG AI members from China Telecom and Raisecom Technology): the upstream `train_data_augmentation/` silently mixed the 173 original tiles with their geometric transforms — here the originals are dropped (they remain in the core split) and the transforms moved to a dedicated `augmented/` folder, and the 156 transforms derived from val-split tiles were removed so the augmented set can never leak validation content; a seeded, class-stratified train/val/test split (147 / 26 / 60) was added; Pascal VOC + YOLO annotations were provided; and the upstream VOC metadata (bogus `UAV autolanding` folder/source/owner, and `.jpg` names for `.jpeg` files) was fixed. No bounding box was modified. Upstream licence unstated."
    summary_zh: "**PCB-AoI 公开数据集**的清理修正版（KubeEdge-Ianvs，由中国电信与瑞斯康达的 KubeEdge SIG AI 成员发布）：上游 `train_data_augmentation/` 把 173 张原始图与几何变换图混存 —— 本版删除其中的原始图（核心划分中已保留）、将变换图移入独立的 `augmented/` 目录，并剔除源自 val 集的 156 张变换图，确保增强集绝不泄漏验证集内容；新增带随机种子的 85/15 分层 train/val 划分（147 / 26 / 60）；补充 Pascal VOC + YOLO 标注；并修正上游 VOC 元数据（错误的 `UAV autolanding` folder/source/owner，以及把 `.jpeg` 写成 `.jpg`）。未改动任何标注框。上游未声明许可证。"

