datasets:
  - id: PlantDoc-corrected
    emoji: "🌱"
    domain_en: "Agriculture — plant disease"
    domain_zh: "农业 — 植物病害"
    domain_short: "Agriculture (plant disease)"
    images: 2565
    boxes: 8887
    classes: 29
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/PlantDoc-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/PlantDoc-corrected
    doi: 10.57967/hf/10678
    description_en: "Plant leaf disease detection, 29 classes (VOC + YOLO) — cleaned version of PlantDoc with train/test leakage removed and a reproducible split added"
    description_zh: "植物叶片病害检测，29 类（VOC + YOLO）—— PlantDoc 数据集的清理修正版，已剔除训练/测试泄漏并补上可复现划分"
    blurb_en: "Plant leaf disease detection across 13 crops, 29 classes, Pascal VOC + YOLO annotations, with train/test leakage removed."
    blurb_zh: "覆盖 13 种作物的植物叶片病害检测，29 类，Pascal VOC + YOLO 格式，已剔除训练/测试泄漏。"
    summary_en: "Cleaned version of the **PlantDoc** object-detection dataset (Singh et al., CoDS-COMAD 2020, [doi:10.1145/3371158.3371196](https://doi.org/10.1145/3371158.3371196), CC BY 4.0): **12 images were byte-identical between `TRAIN/` and `TEST/`** — a hard train/test leak — and were removed; 11 images shipped with an **empty XML** (no `<object>`) and 11 more with **no XML at all** were dropped; 4 images downloaded only as low-resolution thumbnails while annotated at original resolution (so their boxes lie outside the frame) were dropped, as was 1 orphan XML; **35 images carried an EXIF orientation tag** while their boxes had been authored against the stored pixel orientation — 30 received a byte-level tag strip (pixels untouched) and 5 had the EXIF rotation baked into the pixels, so the annotation canvas now matches the stored pixels under every loader (PIL, OpenCV, Ultralytics); 4 VOC files declaring `<width>0</width><height>0</height>` were repaired; **all 234 URL-tainted filenames** (`%20`, `+`, `?itok=`, `%253E`, 25 extension-less files and 12 with script extensions such as `.ashx`) were sanitised, and scraped SEO names running up to 215 characters were truncated to ≤80 characters plus an 8-hex-digit hash of the upstream name; all **29 class names** were normalised to Title Case (fixing the `Soyabean` typo); and a reproducible split was added — the official `TEST/` (236) is kept as **test** for paper comparability while a stratified 10 % **val** (233) is carved out of `TRAIN/` (seed 42). **All 8,887 bounding boxes are carried over unchanged** — no coordinate was scaled, shifted or re-guessed."
    summary_zh: "**PlantDoc** 目标检测数据集的清理修正版（Singh 等，CoDS-COMAD 2020，[doi:10.1145/3371158.3371196](https://doi.org/10.1145/3371158.3371196)，CC BY 4.0）：**12 张图像在 `TRAIN/` 与 `TEST/` 中逐字节相同** —— 属于硬性训练/测试泄漏，已删除；11 张图像携带**空 XML**（无 `<object>`）、另有 11 张**完全没有 XML**，均已剔除；4 张图像只下载到低分辨率缩略图却按原图分辨率标注（标注框落在画布之外）被剔除，另剔除 1 个孤立 XML；**35 张图像带有 EXIF 方向标签**，而其标注框是按**存储像素方向**绘制的 —— 其中 30 张采用字节级剥离方向标签（像素不变），5 张把 EXIF 旋转**烘焙进像素**，从而使无论在哪个框架下读取（PIL、OpenCV、Ultralytics），标注画布都与存储像素方向一致；4 个声明 `<width>0</width><height>0</height>` 的 VOC 文件已修复；**全部 234 个含 URL 污染的文件名**（`%20`、`+`、`?itok=`、`%253E`，其中 25 个无扩展名、12 个带 `.ashx` 等网页脚本扩展名）已净化，上游抓取网页留下的最长 215 字符的 SEO 长文件名统一截断至 ≤80 字符并追加原文件名的 8 位十六进制哈希；**29 个类别名**全部统一为 Title Case（并修正 `Soyabean` 拼写错误）；同时补上可复现划分 —— 官方 `TEST/`（236 张）保留为 **test** 以便与论文对比，并从 `TRAIN/` 中分层切出 10% 作为 **val**（233 张，随机种子 42）。**8,887 个标注框全部原样迁移**，未做任何缩放、平移或重推。"

  - id: PCB_AoI_KubeEdge-corrected
    emoji: "🖥️"
    domain_en: "Industrial — PCB"
    domain_zh: "工业 — PCB"
    domain_short: "Industrial (PCB)"
    images: 233
    boxes: 1011
    classes: 2
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/PCB_AoI_KubeEdge-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/PCB_AoI_KubeEdge-corrected
    doi: 10.57967/hf/10677
    description_en: "PCB AOI defect detection, 2 classes (VOC + YOLO) — cleaned version of the KubeEdge-Ianvs PCB-AoI dataset, with a training-only augmentation set"
    description_zh: "PCB AOI 缺陷检测，2 类（VOC + YOLO）—— KubeEdge-Ianvs PCB-AoI 数据集的清理修正版，含仅训练用增强集"
    blurb_en: "PCB AOI defect detection, 2 classes, Pascal VOC + YOLO annotations, with a de-duplicated training-only augmentation set."
    blurb_zh: "PCB AOI 缺陷检测，2 类，Pascal VOC + YOLO 格式，含去重后的仅训练用增强集。"
    summary_en: "Cleaned version of the **PCB-AoI Public Dataset** (KubeEdge-Ianvs, by KubeEdge SIG AI members from China Telecom and Raisecom Technology): the upstream `train_data_augmentation/` silently mixed the 173 original tiles with their geometric transforms — here the originals are dropped (they remain in the core split) and the transforms moved to a dedicated `augmented/` folder, and the 156 transforms derived from val-split tiles were removed so the augmented set can never leak validation content; a seeded, class-stratified train/val/test split (147 / 26 / 60) was added; Pascal VOC + YOLO annotations were provided; and the upstream VOC metadata (bogus `UAV autolanding` folder/source/owner, and `.jpg` names for `.jpeg` files) was fixed. No bounding box was modified. Upstream licence unstated."
    summary_zh: "**PCB-AoI 公开数据集**的清理修正版（KubeEdge-Ianvs，由中国电信与瑞斯康达的 KubeEdge SIG AI 成员发布）：上游 `train_data_augmentation/` 把 173 张原始图与几何变换图混存 —— 本版删除其中的原始图（核心划分中已保留）、将变换图移入独立的 `augmented/` 目录，并剔除源自 val 集的 156 张变换图，确保增强集绝不泄漏验证集内容；新增带随机种子的 85/15 分层 train/val 划分（147 / 26 / 60）；补充 Pascal VOC + YOLO 标注；并修正上游 VOC 元数据（错误的 `UAV autolanding` folder/source/owner，以及把 `.jpeg` 写成 `.jpg`）。未改动任何标注框。上游未声明许可证。"

  - id: MagneticTile-corrected
    emoji: "🧲"
    domain_en: "Industrial — magnetic tile"
    domain_zh: "工业 — 磁瓦表面"
    domain_short: "Industrial (magnetic tile)"
    images: 1318
    boxes: 437
    classes: 5
    format: "Pascal VOC + YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/MagneticTile-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/MagneticTile-corrected
    doi: 10.57967/hf/10659
    description_en: "Magnetic tile surface defects, 5 classes (VOC + YOLO) — bounding-box standardized version of the Magnetic Tile Surface Defect Dataset"
    description_zh: "磁瓦表面缺陷，5 类（VOC + YOLO）—— 磁瓦表面缺陷数据集的目标检测框规整版"
    blurb_en: "Magnetic tile surface defects, 5 classes, Pascal VOC + YOLO annotations, with burst-shot duplicates removed."
    blurb_zh: "磁瓦表面缺陷，5 类，Pascal VOC + YOLO 格式，已剔除连拍重复帧。"
    summary_en: "Cleaned and bounding-box standardized version of the **Magnetic Tile Surface Defect Dataset** (Huang, Qiu & Yuan, [arXiv:1805.01168](https://arxiv.org/abs/1805.01168), 2018): upstream ships only grayscale saliency masks and **no bounding boxes**, so 437 tight boxes were extracted for the 5 defect classes via adaptive Otsu thresholding; **22 burst-shot near-duplicate frames** were isolated (sub-second industrial camera repeats, MAE 1.64–4.14) to remove train/test leakage; 4 images in `MT_Uneven` carrying 100 % black masks were removed; and a seeded stratified 70/10/20 split was added. CC BY 4.0."
    summary_zh: "**磁瓦表面缺陷数据集** 的清理与检测框规整版（Huang 等，[arXiv:1805.01168](https://arxiv.org/abs/1805.01168)，2018）：上游仅提供灰度显著性掩码而**无检测框**，本版通过自适应 Otsu 阈值分割为 5 类缺陷提取出 **437 个紧密 Bounding Box**；隔离 **22 张连拍近似重复帧**（工业相机微秒级连拍，平均像素差 1.64–4.14），消除训练/测试泄漏；剔除 `MT_Uneven` 中 4 张掩码全黑的脏图；并新增带随机种子的 70/10/20 分层划分。CC BY 4.0。"

