    summary_zh: "**DeepPCB** 的清理修正版（Tang 等，[arXiv:1902.06197](https://arxiv.org/abs/1902.06197)）：上游划分列表引用了不存在的文件（1,500 条图片路径全部失效），本版重写为可解析路径；删除了 1 张把标注烧进像素的图与 1 张孤立模板；61 张 RGB 图归一为灰度（内容不变）；补充 Pascal VOC 与 YOLO 标注。MIT 许可。"


