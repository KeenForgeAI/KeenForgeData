# =============================================================================
# KeenForgeData — single source of truth for every published dataset
# =============================================================================
#
# Edit THIS file, then run:
#
#     python tools/update_cards.py          # regenerate + show a diff
#     python tools/update_cards.py --push   # regenerate, push to GitHub and HF
#
# It regenerates every place that lists our datasets:
#
#   * README.md            (this repo, on GitHub)
#   * org-card/README.md   (the Hugging Face organization card, Space KeenForgeAI/README)
#
# Never edit the generated blocks by hand — they are delimited by
# <!-- GEN:... --> markers and will be overwritten.
# =============================================================================

org:
  name: KeenForgeAI
  hf_org: https://huggingface.co/KeenForgeAI
  ms_org: https://www.modelscope.ai/organizations/KeenForgeAI
  github_tool: https://github.com/KeenForgeAI/KeenForge
  website: https://keenforgeai.github.io/
  issues: https://github.com/KeenForgeAI/KeenForge/issues

# Newest first. The order here is the order shown everywhere.
datasets:

  - id: GC10-DET-corrected
    emoji: "🏭"
    domain_en: "Industrial — steel surface"
    domain_zh: "工业 — 钢板表面"
    domain_short: "Industrial (steel)"
    images: 2280
    boxes: 3542
    classes: 10
    format: "Pascal VOC"
    hf: https://huggingface.co/datasets/KeenForgeAI/GC10-DET-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/GC10-DET-corrected
    description_en: "Hot-rolled steel strip surface defects, 10 classes (Pascal VOC) — cleaned version of GC10-DET"
    description_zh: "热轧钢板表面缺陷，10 类（Pascal VOC）—— GC10-DET 的清理修正版"
    blurb_en: "Hot-rolled steel strip surface defects, 10 classes, Pascal VOC annotations."
    blurb_zh: "热轧带钢表面缺陷，10 类，Pascal VOC 格式。"
    summary_en: "Cleaned version of [GC10-DET](https://github.com/lvxiaoming2019/GC10-DET-Metallic-Surface-Defect-Datasets): 13 duplicate images removed, 26 un-annotated images removed, and 132 annotation files with wrong class names fixed (`10_yaozhed` → `10_yaozhe`, one garbage label `d` → `1_chongkong`)."
    summary_zh: "修正了 13 张重复图片、26 张无标注图片，以及 132 个类别名错误的标注文件（`10_yaozhed` → `10_yaozhe`，垃圾标签 `d` → `1_chongkong`）。"

  - id: TXL-PBC-corrected
    emoji: "🩸"
    domain_en: "Medical — hematology"
    domain_zh: "医疗 — 血液学"
    domain_short: "Medical (hematology)"
    images: 1256
    boxes: 18098
    classes: 3
    format: "YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/TXL-PBC-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/TXL-PBC-corrected
    description_en: "Peripheral blood cell detection (WBC / RBC / Platelets) — corrected version of TXL-PBC"
    description_zh: "外周血细胞检测（白细胞 / 红细胞 / 血小板）—— TXL-PBC 的修正版"
    blurb_en: "Peripheral blood cell detection (WBC / RBC / Platelets), 3 classes, YOLO format."
    blurb_zh: "外周血细胞检测（白细胞 / 红细胞 / 血小板），3 类，YOLO 格式。"
    summary_en: "Corrected version of the **TXL-PBC** dataset (Gan, Li & Wang, *Scientific Data* 12:1694, 2025, [doi:10.1038/s41597-025-05980-z](https://doi.org/10.1038/s41597-025-05980-z)): 4 duplicate images removed, labels and README corrected."
    summary_zh: "**TXL-PBC** 数据集的修正版（Gan, Li & Wang, *Scientific Data* 12:1694, 2025）：删除 4 张重复图片，并订正了标签与说明文档。"

  - id: raccoon-corrected
    emoji: "🦝"
    domain_en: "Wildlife"
    domain_zh: "野生动物"
    domain_short: "Wildlife"
    images: 193
    boxes: 211
    classes: 1
    format: "YOLO"
    hf: https://huggingface.co/datasets/KeenForgeAI/raccoon-corrected
    ms: https://www.modelscope.ai/datasets/KeenForgeAI/raccoon-corrected
    description_en: "Fully re-annotated version of the classic Raccoon detection dataset"
    description_zh: "经典浣熊检测数据集的完全重标版"
    blurb_en: "The classic Raccoon detection dataset, fully re-annotated."
    blurb_zh: "经典浣熊检测数据集，完全重新标注。"
    summary_en: "Boxes tightened (average IoU 0.810 against the original), mislabels fixed, 7 duplicate images removed, missed instances added."
    summary_zh: "框全部收紧（对原标注平均 IoU 0.810）、修正错标、删除 7 张重复图片、补上漏标目标。"
